<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Platform Atlas — plate colourways</title>
    <style>
      body {
        margin: 0;
        background: #0a0906;
        color: #f1ebdc;
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        display: grid;
      }
      .sheet {
        display: grid;
        grid-template-columns: 600px 600px;
        gap: 24px;
        padding: 24px;
      }
      figure {
        margin: 0;
        width: 600px;
      }
      .frame {
        width: 600px;
        height: 315px;
        overflow: hidden;
        position: relative;
      }
      iframe {
        width: 1200px;
        height: 630px;
        border: 0;
        transform: scale(0.5);
        transform-origin: top left;
        display: block;
      }
      figcaption {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #938b78;
        padding-top: 10px;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <figure>
        <div class="frame">
          <iframe src="social-card-plate.html?s=og&v=paper" title="paper colourway"></iframe>
        </div>
        <figcaption><span>Colourway A</span><span>Paper</span></figcaption>
      </figure>
      <figure>
        <div class="frame">
          <iframe src="social-card-plate.html?s=og&v=ink" title="ink colourway"></iframe>
        </div>
        <figcaption><span>Colourway B</span><span>Ink</span></figcaption>
      </figure>
    </div>
  </body>
</html>
